services:
  frontend:
    # Evitamos que en local levante el contenedor de frontend
    deploy:
      replicas: 0

  usuariosapi:
    ports:
      - "5002:80"

  clientesapi:
    ports:
      - "5003:80"

  parametrosapi:
    ports:
      - "5001:80"

  agendamientosapi:
    ports:
      - "5004:80"

  productosapi:
    ports:
      - "5005:80"
      
  informesapi:
    ports:
      - "5006:80"

  gateway:
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf
