server {
    listen 80;

    location /api/usuarios/ {
        proxy_pass http://usuarios-api/;
    }

    location /api/clientes/ {
        proxy_pass http://clientes-api/;
    }

    location /api/parametros/ {
        proxy_pass http://parametros-api/;
    }

    location / {
        proxy_pass http://agitime-frontend/;
        try_files $uri $uri/ /index.html;
    }
}