# ==============================
# AGITIME
# ==============================
server {
    listen 443 ssl;
    server_name agitime.com.co www.agitime.com.co;

    ssl_certificate /etc/letsencrypt/live/agitime.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agitime.com.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://frontend:80/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/Parametros/ {
        proxy_pass http://parametrosapi:80/api/Parametros/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/Usuarios/ {
        proxy_pass http://usuariosapi:80/api/Usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/Clientes/ {
        proxy_pass http://clientesapi:80/api/Clientes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/Agendamiento/ {
        proxy_pass http://agendamientosapi:80/api/Agendamiento/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/Productos/ {
        proxy_pass http://productosapi:80/api/Productos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/Informes/ {
        proxy_pass http://informesapi:80/api/Informes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ==============================
# Centurion Seguros
# ==============================
server {
    server_name centurionseguros.com.co www.centurionseguros.com.co;

    root /var/www/centurion;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/centurionseguros.com.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/centurionseguros.com.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ==============================
# Redirección HTTP a HTTPS
# ==============================
server {
    if ($host = www.centurionseguros.com.co) {
        return 301 https://$host$request_uri;
    }
    if ($host = centurionseguros.com.co) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name centurionseguros.com.co www.centurionseguros.com.co;
    return 404;
}

server {
    listen 80;
    server_name agitime.com.co www.agitime.com.co;
    return 301 https://$host$request_uri;
}