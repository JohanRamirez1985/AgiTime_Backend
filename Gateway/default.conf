server {
    listen 80;
    server_name localhost;

    # Frontend corriendo en local (ng serve)
    location / {
        proxy_pass http://host.docker.internal:4200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Parametros
    location /api/Parametros/ {
        proxy_pass http://host.docker.internal:5001/api/Parametros/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Usuarios
    location /api/Usuarios/ {
        proxy_pass http://host.docker.internal:5002/api/Usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Clientes
    location /api/Clientes/ {
        proxy_pass http://host.docker.internal:5003/api/Clientes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Agendamientos
    location /api/Agendamiento/ {
        proxy_pass http://host.docker.internal:5004/api/Agendamiento/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Productos
    location /api/Productos/ {
        proxy_pass http://host.docker.internal:5005/api/Productos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}