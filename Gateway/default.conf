server {
    listen 443 ssl;
    server_name agitime.com.co www.agitime.com.co;

    ssl_certificate /etc/letsencrypt/live/agitime.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agitime.com.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 🚀 Frontend (Angular)
    location / {
        proxy_pass http://agitime-frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
		proxy_pass http://agitime-frontend/assets/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}

    # API de Parámetros
    location /api/Parametros/ {
        proxy_pass http://parametros-api/api/Parametros/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Usuarios
    location /api/Usuarios/ {
        proxy_pass http://usuarios-api/api/Usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Clientes
    location /api/Clientes/ {
        proxy_pass http://clientes-api/api/Clientes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Agendamientos
    location /api/Agendamiento/ {
        proxy_pass http://agendamientos-api/api/Agendamiento/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Productos
    location /api/Productos/ {
        proxy_pass http://productos-api/api/Productos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Informes
    location /api/Informes/ {
        proxy_pass http://informes-api/api/Informes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}