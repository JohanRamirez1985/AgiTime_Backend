events {}

http {
    server {
        listen 80;

    ### FRONTEND ###
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    ### MICROSERVICIO USUARIOS ###
        location /api/usuarios/ {
            proxy_pass http://usuarios:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    ### MICROSERVICIO PARAMETROS ###
        location /api/parametros/ {
            proxy_pass http://parametros:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
}