events {}

http {
    server {
        listen 80;

        location /api/usuarios/ {
            rewrite ^/api/usuarios/(.*)$ /$1 break;
            proxy_pass http://usuarios:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/parametros/ {
            rewrite ^/api/parametros/(.*)$ /$1 break;
            proxy_pass http://parametros:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/clientes/ {
            rewrite ^/api/clientes/(.*)$ /$1 break;
            proxy_pass http://clientes:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://swagger-ui:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
