services:
  usuariosapi:
    build:
      context: ./servicios
      dockerfile: Usuarios.API/Dockerfile
    container_name: usuarios-api
    ports:
      - "80:80"
    networks:
      - agitime-net
    restart: always

  clientesapi:
    build:
      context: ./servicios
      dockerfile: Clientes.API/Dockerfile
    container_name: clientes-api
    ports:
      - "81:80"
    networks:
      - agitime-net
    restart: always

  parametrosapi:
    build:
      context: ./servicios
      dockerfile: Parametros.API/Dockerfile
    container_name: parametros-api
    ports:
      - "82:80"
    networks:
      - agitime-net
    restart: always

  agendamientosapi:
    build:
      context: ./servicios
      dockerfile: Agendamiento.API/Dockerfile
    container_name: agendamientos-api
    ports:
      - "83:80"
    networks:
      - agitime-net
    restart: always

  productosapi:
    build:
      context: ./servicios
      dockerfile: Productos.API/Dockerfile
    container_name: productos-api
    ports:
      - "84:80"
    networks:
      - agitime-net
    restart: always
    
  # frontend:
  #   build:
  #     context: ./FrontEnd
  #     dockerfile: Dockerfile
  #   container_name: agitime-frontend
  #   ports:
  #     - "4200:80"
  #   networks:
  #     - agitime-net
  #   restart: always

networks:
  agitime-net:
    driver: bridge
