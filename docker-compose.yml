version: "3.8"

services:
  usuariosapi:
    image: usuariosapi:latest
    container_name: usuarios-api
    ports:
      - "80:80"
    networks:
      - agitime-net
    restart: always

  clientesapi:
    image: clientesapi:latest
    container_name: clientes-api
    ports:
      - "81:80"
    networks:
      - agitime-net
    restart: always

  parametrosapi:
    image: parametrosapi:latest
    container_name: parametros-api
    ports:
      - "82:80"
    networks:
      - agitime-net
    restart: always

  agendamientosapi:
    image: agendamientosapi:latest
    container_name: agendamientos-api
    ports:
      - "83:80"
    networks:
      - agitime-net
    restart: always

networks:
  agitime-net:
    driver: bridge
