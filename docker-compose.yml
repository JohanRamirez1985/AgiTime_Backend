version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: agitime-gateway
    ports:
      - "8080:80"  # puerto local de prueba
    depends_on:
      - usuariosapi
      - clientesapi
      - parametrosapi
      - agendamientosapi
      - productosapi
      - informesapi
      - frontend
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-gateway:latest

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agitime-frontend
    expose:
      - "80"
    volumes:
      - ./frontend/assets/img:/usr/share/nginx/html/assets/img
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-frontend:latest

  usuariosapi:
    build:
      context: ./servicios
      dockerfile: Usuarios.API/Dockerfile
    container_name: usuarios-api
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-usuariosapi:latest

  clientesapi:
    build:
      context: ./servicios
      dockerfile: Clientes.API/Dockerfile
    container_name: clientes-api
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-clientesapi:latest

  parametrosapi:
    build:
      context: ./servicios
      dockerfile: Parametros.API/Dockerfile
    container_name: parametros-api
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-parametrosapi:latest

  agendamientosapi:
    build:
      context: ./servicios
      dockerfile: Agendamiento.API/Dockerfile
    container_name: agendamientos-api
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-agendamientosapi:latest

  productosapi:
    build:
      context: ./servicios
      dockerfile: Productos.API/Dockerfile
    container_name: productos-api
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-productosapi:latest

  informesapi:
    build:
      context: ./servicios
      dockerfile: Informes.API/Dockerfile
    container_name: informes-api
    networks:
      - agitime-net
    restart: always
    image: agitime/agitime-informesapi:latest

networks:
  agitime-net:
    driver: bridge