version: "3.8"

services:
  gateway:
    build: ./gateway
    ports:
      - "80:80"
    depends_on:
      - frontend
      - usuarios
      - productos

  frontend:
    build: ./frontend
    expose:
      - "3000"

  usuarios:
    build: ./servicios/Usuarios.API
    expose:
      - "5000"

  productos:
    build: ./servicios/productos
    expose:
      - "5001"
