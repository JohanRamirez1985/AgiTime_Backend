version: "3.8"

services:
  gateway:
    build:
      context: ./gateway
    container_name: agitime-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - usuariosapi
      - parametrosapi
      - clientesapi
    networks:
      - agitime-net
    restart: always

  frontend:
    image: agitime/agitime-frontend:latest
    container_name: agitime-frontend
    ports:
      - "8080:80"
    networks:
      - agitime-net
    restart: always

  usuariosapi:
    image: agitime/agitime-usuariosapi:latest
    container_name: usuarios-api
    networks:
      - agitime-net
    restart: always

  clientesapi:
    image: agitime/agitime-clientesapi:latest
    container_name: clientes-api
    networks:
      - agitime-net
    restart: always

  parametrosapi:
    image: agitime/agitime-parametrosapi:latest
    container_name: parametros-api
    networks:
      - agitime-net
    restart: always

networks:
  agitime-net:
    driver: bridge
