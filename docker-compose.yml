services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: agitime-gateway
    ports:
      - "80:80"
    depends_on:
      - usuariosapi
      - clientesapi
      - parametrosapi
      - agendamientosapi
      - productosapi
      - frontend
    networks:
      - agitime-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agitime-frontend
    expose:
      - "80"
    networks:
      - agitime-net
    restart: always

  usuariosapi:
    build:
      context: ./servicios
      dockerfile: Usuarios.API/Dockerfile
    container_name: usuarios-api
    networks:
      - agitime-net
    restart: always

  clientesapi:
    build:
      context: ./servicios
      dockerfile: Clientes.API/Dockerfile
    container_name: clientes-api
    networks:
      - agitime-net
    restart: always

  parametrosapi:
    build:
      context: ./servicios
      dockerfile: Parametros.API/Dockerfile
    container_name: parametros-api
    networks:
      - agitime-net
    restart: always

  agendamientosapi:
    build:
      context: ./servicios
      dockerfile: Agendamiento.API/Dockerfile
    container_name: agendamientos-api
    networks:
      - agitime-net
    restart: always

  productosapi:
    build:
      context: ./servicios
      dockerfile: Productos.API/Dockerfile
    container_name: productos-api
    networks:
      - agitime-net
    restart: always

networks:
  agitime-net:
    driver: bridge
