server {
    listen 80;
    server_name localhost;

    # DNS interno de Docker: resuelve agitime-frontend en cada petición,
    # así el gateway arranca aunque el contenedor del front (otro repo) aún no esté arriba.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Servir el frontend (Angular) desde su contenedor (repo AgiTime_Frontend, red agitime-net)
    location / {
        set $frontend http://agitime-frontend;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Parametros
    location /api/Parametros/ {
        proxy_pass http://parametros-api/api/Parametros/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Usuarios
    location /api/Usuarios/ {
        proxy_pass http://usuarios-api/api/Usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Clientes
    location /api/Clientes/ {
        proxy_pass http://clientes-api/api/Clientes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Agendamientos
    location /api/Agendamiento/ {
        proxy_pass http://agendamientos-api/api/Agendamiento/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Productos
    location /api/Productos/ {
        proxy_pass http://productos-api/api/Productos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Informes
    location /api/Informes/ {
        proxy_pass http://informes-api/api/Informes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
