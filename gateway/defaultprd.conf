server {
    listen 80;
    server_name localhost;

    # Servir el frontend (Angular) desde su contenedor
    location / {
        proxy_pass http://agitime-frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Parametros
    location /api/Parametros/ {
        proxy_pass http://parametros-api/api/Parametros/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Usuarios
    location /api/Usuarios/ {
        proxy_pass http://usuarios-api/api/Usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Clientes
    location /api/Clientes/ {
        proxy_pass http://clientes-api/api/Clientes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Agendamientos
    location /api/Agendamiento/ {
        proxy_pass http://agendamientos-api/api/Agendamiento/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API de Productos
    location /api/Productos/ {
        proxy_pass http://productos-api/api/Productos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}